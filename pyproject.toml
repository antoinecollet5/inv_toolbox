[build-system]
requires = ["setuptools>=42,<=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inv_toolbox"
dynamic = ["version"]
authors = [{ name = "Antoine Collet", email = "antoinecollet5@gmail.com" }]
readme = "README.rst"
description = "A python toolbox for inverse problem resolution (preconditioning, regularization, finite differences, etc.)."
keywords = [
    "Covariance",
    "Regularization",
    "Preconditioner",
    "Inverse problem",
    "Finite differences",
]
license = { file = "LICENSE" }
dependencies = [
    "setuptools",
    "wheel",
    "numpy>=1.2",
    "scipy>=1.6.2",
    "covmats>=0.5.0",
    "quickpaver>=0.4.0",
    "packaging",
    "typing_extensions",
    "nested_grid_plotter>=2.1.1",
    "numdifftools",
]

requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://pypi.org/project/inv_toolbox/"
Documentation = "https://inv_toolbox.readthedocs.io/en/latest/"
Repository = "https://github.com/antoinecollet5/inv_toolbox"
Issues = "https://github.com/antoinecollet5/inv_toolbox/issues"
Changelog = "https://github.com/antoinecollet5/inv_toolbox/blob/master/CHANGELOG.rst"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["inv_toolbox*"]


[tool.setuptools.dynamic]
version = { attr = "inv_toolbox.__about__.__version__" }

[project.optional-dependencies]
all = ['inv_toolbox[install, lint, tests, examples, docs]']
docs = [
    "inv_toolbox[examples]",
    "sphinx<9",
    "nbsphinx",
    "nbsphinx-link>=1.3.1",
    "jupyter_sphinx>=0.3.2",
    "sphinx-jsonschema>=1.15",
    "pygments>=2.11.1",
    "pydata-sphinx-theme",
    "sphinxcontrib-bibtex",
    "sphinx_math_dollar",
    "jupytext",
]
tests = [
    "twine==1.14.0",
    "pytest",
    "pytest-runner",
    "pytest-cov",
    "pytest-cookies",
    "coverage",
]
examples = ["matplotlib", "marimo"]
lint = [
    "pre-commit",
    "pre-commit-hooks",
    "codespell>=2.1.0",
    "ruff",
    "ty==0.0.80",
]
install = ["pip", "wheel"]

[tool.ruff]
lint.select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "I",
]
src = ["inv_toolbox", "tests", "docs", "notebooks"]

# Allow autofix for all enabled rules (when `--fix`) is provided.
lint.fixable = ["A", "B", "C", "D", "E", "F", "I"]
lint.unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88

# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.pylint.LOGGING]
# Format style used to check logging format string. `old` means using %
# formatting, `new` is for `{}` formatting,and `fstr` is for f-strings.
logging-format-style = "fstr"

[tool.ty.src]
include = ["inv_toolbox", "tests", "notebooks"]


[tool.pytest.ini_options]
testpaths = ["tests", "notebooks"]

# skip assert warnings with codacy
[tool.bandit]
skips = ["B101"]
